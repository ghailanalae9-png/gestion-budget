<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test de gestion financière</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>💰 Test de gestion financière</h1>
        <p>Découvrez votre personnalité financière</p>
    </header>

    <div id="quiz"></div>

    <button id="resultBtn" onclick="showResult()">
        Voir mon résultat
    </button>

    <div id="result" class="result hidden"></div>

    <button id="restartBtn"
            class="restart hidden"
            onclick="restartQuiz()">
        Recommencer
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
